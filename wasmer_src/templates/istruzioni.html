{% extends "base.html" %}

{% block title %}Istruzioni - Il Sentiero dei Draghi{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h1><i class="bi bi-question-circle text-primary"></i> Istruzioni per l'uso</h1>
        <p class="text-muted">Guida completa all'utilizzo del software di gestione prestiti giochi</p>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body">
                <div id="markdown-content" class="markdown-body">
                    <!-- Il contenuto markdown verrà renderizzato qui -->
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .markdown-body {
        font-size: 16px;
        line-height: 1.6;
        color: #333;
    }
    
    .markdown-body h1 {
        border-bottom: 2px solid #667eea;
        padding-bottom: 10px;
        margin-top: 30px;
        margin-bottom: 20px;
        color: #667eea;
    }
    
    .markdown-body h2 {
        margin-top: 25px;
        margin-bottom: 15px;
        color: #764ba2;
        font-size: 1.5rem;
    }
    
    .markdown-body h3 {
        margin-top: 20px;
        margin-bottom: 10px;
        color: #555;
        font-size: 1.25rem;
    }
    
    .markdown-body ul, .markdown-body ol {
        margin-left: 20px;
        margin-bottom: 15px;
    }
    
    .markdown-body li {
        margin-bottom: 5px;
    }
    
    .markdown-body code {
        background-color: #f5f5f5;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: 'Courier New', monospace;
        color: #e83e8c;
    }
    
    .markdown-body pre {
        background-color: #f5f5f5;
        padding: 15px;
        border-radius: 5px;
        overflow-x: auto;
    }
    
    .markdown-body strong {
        color: #333;
        font-weight: 600;
    }
    
    .markdown-body hr {
        margin: 30px 0;
        border: 0;
        border-top: 2px solid #e9ecef;
    }
    
    .markdown-body blockquote {
        border-left: 4px solid #667eea;
        padding-left: 15px;
        color: #666;
        margin: 15px 0;
    }
    
    .markdown-body table {
        border-collapse: collapse;
        width: 100%;
        margin: 15px 0;
    }
    
    .markdown-body table th,
    .markdown-body table td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
    }
    
    .markdown-body table th {
        background-color: #667eea;
        color: white;
    }
</style>
{% endblock %}

{% block extra_js %}
<!-- Marked.js - Markdown to HTML converter -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Markdown content from Flask template
    const markdownContent = {{ contenuto|tojson }};
    
    // Configure marked options
    marked.setOptions({
        breaks: true,
        gfm: true,
        headerIds: true,
        mangle: false
    });
    
    // Convert markdown to HTML
    const htmlContent = marked.parse(markdownContent);
    
    // Insert into page
    document.getElementById('markdown-content').innerHTML = htmlContent;
});
</script>
{% endblock %}
