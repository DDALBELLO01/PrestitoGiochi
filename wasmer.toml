[package]
name = "ddalbello01/software-prestiti"
version = "0.2.16"
description = "Il Sentiero dei Draghi - gestione prestiti giochi"

[dependencies]
"python/python" = "^0.2.0"

[fs]
"/src" = "./wasmer_src"
"/site-packages" = "./vendor"

[[command]]
name = "web"
module = "python/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-m", "flask", "--app", "/src/app", "run", "--host=0.0.0.0", "--port=8080", "--no-debugger", "--no-reload"]
env = ["PYTHONEXECUTABLE: /bin/python", "PYTHONPATH: /site-packages"]
